[project]
name = "apiverve-wordstonumbers"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Words to Numbers converts spelled-out number phrases into numeric digits. Pass written words to receive the calculated number, formatted English notation, and total digit counts."
keywords = ["words to numbers api", "convert words to numbers", "spelled out numbers to digits", "text to number conversion", "written numbers to digits"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/wordstonumbers?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/wordstonumbers?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/wordstonumbers-api"
Twitter = "https://twitter.com/apivervehq"
